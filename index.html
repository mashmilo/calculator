<style>
*{box-sizing:border-box}
body{margin:0 auto;background:#111;color:#fff;font:18px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;max-width:420px}
#disp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:20px;word-break:break-all}
#ex{color:#888;min-height:24px}#rs{font-size:52px}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px}
#pad button{height:68px;border:0;border-radius:34px;background:#333;color:#fff;font-size:26px}
#pad button.op{background:#f5a623;color:#111}#pad button.fn{background:#555}
#pad button:active{filter:brightness(1.4)}
#vault{position:fixed;inset:0;background:#111;overflow:auto;padding:16px;max-width:420px;margin:auto}
#vault[hidden]{display:none}
#vault h2{margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
#vault button,#vault label.b{background:#f5a623;color:#111;border:0;border-radius:8px;padding:8px 12px;font-size:15px;margin:2px;display:inline-block}
#vault textarea{width:100%;height:70px;background:#222;color:#fff;border:1px solid #444;border-radius:8px;padding:8px;margin:8px 0}
#list{list-style:none;padding:0}
#list li{background:#1c1c1c;border-radius:8px;padding:10px;margin:8px 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
#list li span{flex:1 1 100%;word-break:break-all;font-size:15px}
</style></head><body>
<div id="disp"><div id="ex"></div><div id="rs">0</div></div>
<div id="pad"></div>

<div id="vault" hidden>
  <h2>Vault <button id="lock">Lock</button></h2>
  <label class="b">Add files<input id="file" type="file" multiple hidden></label>
  <textarea id="note" placeholder="Write a private note..."></textarea>
  <button id="saveNote">Save note</button>
  <ul id="list"></ul>
</div>

<script>
const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder();
// ---------- storage ----------
const db=new Promise((res,rej)=>{const r=indexedDB.open('calc',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('m');r.result.createObjectStore('f',{keyPath:'id',autoIncrement:true})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(s,m,fn)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction(s,m);const r=fn(t.objectStore(s));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})};
const get=k=>tx('m','readonly',s=>s.get(k)),put=(k,v)=>tx('m','readwrite',s=>s.put(v,k));
// ---------- crypto ----------
async function derive(pin,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(key,buf){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv,ct:await crypto.subtle.encrypt({name:'AES-GCM',iv},key,buf)}}
const open=(key,o)=>crypto.subtle.decrypt({name:'AES-GCM',iv:o.iv},key,o.ct);
let K=null;
async function setup(pin){ if(await get('salt'))return false;
  const salt=crypto.getRandomValues(new Uint8Array(16)),key=await derive(pin,salt);
  await put('salt',salt);await put('ver',await seal(key,enc.encode('ok')));K=key;showVault();return true}
async function tryUnlock(pin){const salt=await get('salt');if(!salt)return false;
  try{const key=await derive(pin,salt);await open(key,await get('ver'));K=key;showVault();return true}catch{return false}}
// ---------- calculator ----------
let ex='';
const keys=[['C','fn'],['⌫','fn'],['%','fn'],['÷','op'],'7','8','9',['×','op'],'4','5','6',['−','op'],'1','2','3',['+','op'],'0','.','(',['=','op']];
keys.forEach(k=>{const[l,c]=Array.isArray(k)?k:[k,''];const b=document.createElement('button');b.textContent=l;b.className=c;
  if(l==='=')eqBtn(b);else b.onclick=()=>press(l);$('pad').append(b)});
function eqBtn(b){let t,long=false;
  b.onpointerdown=()=>{long=false;t=setTimeout(async()=>{long=true;if(/^\d{4,12}$/.test(ex)&&await setup(ex)){ex='';draw()}},800)};
  b.onpointerup=b.onpointerleave=()=>clearTimeout(t);
  b.onclick=()=>{if(!long)eq()}}
function press(v){if(ex==='Error')ex='';
  if(v==='C')ex='';else if(v==='⌫')ex=ex.slice(0,-1);else ex+=v;
  $('ex').textContent='';draw()}
function draw(){$('rs').textContent=ex||'0'}
function calc(s){try{const t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
  if(!/^[\d+\-*/.() ]+$/.test(t))return'Error';
  const r=Function('"use strict";return ('+t+')')();return Number.isFinite(r)?String(+r.toPrecision(12)):'Error'}catch{return'Error'}}
async function eq(){
  if(/^\d{4,12}$/.test(ex)&&await tryUnlock(ex)){ex='';draw();return}
  if(/^\d*$/.test(ex)){draw();return}   // wrong PIN just looks like a plain number
  $('ex').textContent=ex+' =';ex=calc(ex);draw()}
// ---------- vault ----------
const btn=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;return b};
function showVault(){$('vault').hidden=false;list()}
function lock(){K=null;$('vault').hidden=true;$('list').innerHTML='';$('note').value=''}
async function addItem(name,type,buf){
  const meta=await seal(K,enc.encode(JSON.stringify({name,type,size:buf.byteLength})));
  const data=await seal(K,buf);await tx('f','readwrite',s=>s.add({meta,data}))}
async function list(){
  const all=await tx('f','readonly',s=>s.getAll()),ul=$('list');ul.innerHTML='';
  if(!all.length){ul.textContent='Empty.';return}
  for(const f of all){const m=JSON.parse(dec.decode(await open(K,f.meta)));
    const li=document.createElement('li'),sp=document.createElement('span');
    sp.textContent=m.name+' · '+(m.size/1024).toFixed(1)+' KB';
    li.append(sp,btn('Open',()=>view(f,m)),btn('Delete',async()=>{await tx('f','readwrite',s=>s.delete(f.id));list()}));ul.append(li)}}
async function view(f,m){
  const url=URL.createObjectURL(new Blob([await open(K,f.data)],{type:m.type||'application/octet-stream'}));
  const a=document.createElement('a');a.href=url;
  if(/^(image|video|text)\/|pdf$/.test(m.type))a.target='_blank';else a.download=m.name;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
$('file').onchange=async e=>{for(const f of e.target.files)await addItem(f.name,f.type,await f.arrayBuffer());e.target.value='';list()};
$('saveNote').onclick=async()=>{const t=$('note').value.trim();if(!t)return;
  await addItem('Note: '+t.slice(0,30),'text/plain',enc.encode(t));$('note').value='';list()};
$('lock').onclick=lock;
document.addEventListener('visibilitychange',()=>{if(document.hidden)lock()});

// installable-app manifest built in code (no extra files needed)
